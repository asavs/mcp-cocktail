[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cocktail"
dynamic = ["version"]
description = "Generic RSI Engine for Multi-Arm Tooling & MCP Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Asa Schaeffer"}
]
keywords = ["mcp", "cli", "subagents", "benchmarking", "rsi", "llm-evaluation", "guardrails"]

[project.scripts]
mcp-cocktail = "mcp_cocktail.cli:main"
mcpcocktail = "mcp_cocktail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mcp_cocktail.__version__"}

# `setup --preset` copies these into the user's workspace, so they have to travel
# in the wheel -- a non-editable install has no repo alongside it to read from.
# Dotfiles need their own pattern: the leading `.` is not matched by `*`.
[tool.setuptools.package-data]
mcp_cocktail = [
    "presets/*/*.json",
    "presets/*/tools/**/*",
    "presets/*/tools/**/.*",
]
