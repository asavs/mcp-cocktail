[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cocktail"
version = "0.2.0"
description = "Generic RSI Engine for Multi-Arm Tooling & MCP Evaluation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Asa Schaeffer"}
]
keywords = ["mcp", "cli", "subagents", "benchmarking", "rsi", "llm-evaluation", "guardrails"]

[project.scripts]
mcp-cocktail = "mcp_cocktail.cli:main"
mcpcocktail = "mcp_cocktail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
